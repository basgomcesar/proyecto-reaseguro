<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Reaseguro App</title>
  </head>
  <body>
    <header>
      <h1>Bienvenido a Reaseguro App</h1>
    </header>

    <main class="main-container">
      <section class="contract-list-container">
        <h2>Lista de Contratos</h2>
        <div class="contract-container">
          <ul id="contract-list"></ul>
        </div>
      </section>

      <section class="form-container">
        <h2>Agregar Contrato</h2>
        <form id="add-contract-form">
          <label for="contract-name">Nombre del Contrato:</label>
          <input type="text" id="contract-name" required />

          <label for="premium-amount">Monto de prima:</label>
          <input type="number" id="premium-amount" required />

          <button type="submit" id="add-contract">Agregar</button>
        </form>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
